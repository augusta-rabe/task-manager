---
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secret
type: Opaque
data:
  secret-key: eW91ci1zdXBlci1zZWNyZXQta2V5LWhlcmU=  # base64 encoded

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-manager-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-manager-config
data:
  FLASK_ENV: "production"
  DATABASE_URL: "sqlite:///data/tasks.db"