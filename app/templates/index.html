<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="../static/images/tasks.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .stat-card i {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-weight: 500;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
        }

        .task-form {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .task-form h2 {
            margin-bottom: 25px;
            color: #4a5568;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .tasks-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            max-height: 600px;
            overflow-y: auto;
        }

        .tasks-container h2 {
            margin-bottom: 25px;
            color: #4a5568;
            font-size: 1.5rem;
        }

        .task-item {
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            padding: 10px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            position: relative;
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .task-item.completed {
            opacity: 0.7;
            text-decoration: line-through;
        }

        .task-item.high {
            border-left-color: #e53e3e;
        }

        .task-item.medium {
            border-left-color: #ed8936;
        }

        .task-item.low {
            border-left-color: #38a169;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #2d3748;
        }

        .task-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-complete {
            background: #38a169;
            color: white;
        }

        .btn-delete {
            background: #e53e3e;
            color: white;
        }

        .btn-small:hover {
            transform: scale(1.05);
        }

        .priority-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-high {
            background: #fed7d7;
            color: #c53030;
        }

        .priority-medium {
            background: #feebc8;
            color: #c05621;
        }

        .priority-low {
            background: #c6f6d5;
            color: #2f855a;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-tasks"></i> Task Manager Pro</h1>
            <p>Gérez vos tâches avec style et efficacité</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <i class="fas fa-list-ul" style="color: #667eea;"></i>
                <h3 id="totalTasks">-</h3>
                <p>Total des tâches</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle" style="color: #38a169;"></i>
                <h3 id="completedTasks">-</h3>
                <p>Tâches terminées</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock" style="color: #ed8936;"></i>
                <h3 id="pendingTasks">-</h3>
                <p>En attente</p>
            </div>
            <div class="stat-card">
                <i class="fas fa-chart-line" style="color: #764ba2;"></i>
                <h3 id="completionRate">-%</h3>
                <p>Taux de completion</p>
            </div>
        </div>

        <div class="main-content">
            <div class="task-form">
                <h2><i class="fas fa-plus-circle"></i> Nouvelle tâche</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="title">Titre *</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priorité</label>
                        <select id="priority" name="priority">
                            <option value="low">Faible</option>
                            <option value="medium" selected>Moyenne</option>
                            <option value="high">Élevée</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">
                        <i class="fas fa-plus"></i> Ajouter la tâche
                    </button>
                </form>
            </div>

            <div class="tasks-container">
                <h2><i class="fas fa-tasks"></i> Mes tâches</h2>
                <div id="tasksList">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Chargement des tâches...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class TaskManager {
            constructor() {
                this.init();
            }

            async init() {
                await this.loadTasks();
                await this.loadStats();
                this.bindEvents();
            }

            bindEvents() {
                document.getElementById('taskForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.createTask();
                });
            }

            async loadTasks() {
                try {
                    const response = await fetch('/api/tasks');
                    const tasks = await response.json();
                    this.renderTasks(tasks);
                } catch (error) {
                    console.error('Erreur lors du chargement des tâches:', error);
                    this.renderError();
                }
            }

            async loadStats() {
                try {
                    const response = await fetch('/api/stats');
                    const stats = await response.json();
                    this.renderStats(stats);
                } catch (error) {
                    console.error('Erreur lors du chargement des statistiques:', error);
                }
            }

            renderStats(stats) {
                document.getElementById('totalTasks').textContent = stats.total;
                document.getElementById('completedTasks').textContent = stats.completed;
                document.getElementById('pendingTasks').textContent = stats.pending;
                document.getElementById('completionRate').textContent = Math.round(stats.completion_rate) + '%';
            }

            renderTasks(tasks) {
                const container = document.getElementById('tasksList');
                
                if (tasks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>Aucune tâche</h3>
                            <p>Commencez par ajouter votre première tâche!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = tasks.map(task => `
                    <div class="task-item ${task.priority} ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                        <div class="task-header">
                            <div class="task-title">
                                <span>${task.title} </span>
                                <span class="priority-badge priority-${task.priority}" style="margin-left:15px;">${this.getPriorityText(task.priority)}</span>
                            </div>
                            <div class="task-actions">
                                <button class="btn-small btn-complete" onclick="taskManager.toggleTask(${task.id}, ${!task.completed})">
                                    <i class="fas fa-${task.completed ? 'undo' : 'check'}"></i>
                                </button>
                                <button class="btn-small btn-delete" onclick="taskManager.deleteTask(${task.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">                            
                            ${task.description ? `<p style="margin-bottom: 10px; color: #666;">${task.description}</p>` : ''}
                            <small style="color: #999;">${new Date(task.created_at).toLocaleDateString('fr-FR')}</small>
                        </div>
                    </div>
                `).join('');
            }

            getPriorityText(priority) {
                const priorities = {
                    'low': 'Faible',
                    'medium': 'Moyenne',
                    'high': 'Élevée'
                };
                return priorities[priority] || priority;
            }

            async createTask() {
                const form = document.getElementById('taskForm');
                const formData = new FormData(form);
                
                const taskData = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    priority: formData.get('priority')
                };

                try {
                    const response = await fetch('/api/tasks', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(taskData)
                    });

                    if (response.ok) {
                        form.reset();
                        await this.loadTasks();
                        await this.loadStats();
                    }
                } catch (error) {
                    console.error('Erreur lors de la création de la tâche:', error);
                    alert('Erreur lors de la création de la tâche');
                }
            }

            async toggleTask(taskId, completed) {
                try {
                    const response = await fetch(`/api/tasks/${taskId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ completed })
                    });

                    if (response.ok) {
                        await this.loadTasks();
                        await this.loadStats();
                    }
                } catch (error) {
                    console.error('Erreur lors de la mise à jour de la tâche:', error);
                }
            }

            async deleteTask(taskId) {
                if (!confirm('Êtes-vous sûr de vouloir supprimer cette tâche?')) {
                    return;
                }

                try {
                    const response = await fetch(`/api/tasks/${taskId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        await this.loadTasks();
                        await this.loadStats();
                    }
                } catch (error) {
                    console.error('Erreur lors de la suppression de la tâche:', error);
                }
            }

            renderError() {
                document.getElementById('tasksList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle" style="color: #e53e3e;"></i>
                        <h3>Erreur de chargement</h3>
                        <p>Impossible de charger les tâches</p>
                    </div>
                `;
            }
        }

        // Initialiser l'application
        const taskManager = new TaskManager();
    </script>
</body>
</html>
